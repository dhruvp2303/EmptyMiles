name: emptymiles
description: "EmptyMiles - Real Pan-India Logistics & Capacity Optimization Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management & DI
  flutter_riverpod: ^2.5.1
  
  # Routing & Deep Linking
  go_router: ^14.1.4
  
  # Networking & HTTP
  dio: ^5.4.3+1
  
  # Google Maps & Geolocation
  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  
  # Background Execution
  flutter_background_service: ^2.4.6
  
  # Secure Storage & Cache
  flutter_secure_storage: ^9.2.1
  shared_preferences: ^2.2.3
  
  # Firebase & Push Notifications
  firebase_core: ^2.30.1
  firebase_messaging: ^14.9.1
  
  # UI & Utilities
  intl: ^0.19.0
  lucide_icons: ^0.257.0
  signature: ^5.4.1
  image_picker: ^1.1.1
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
